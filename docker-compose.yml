services:
  api:
    build: .
    image: ghcr.io/wangcheng-coder/codebase-knowledge:local
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-8000}
      APP_DATABASE: /data/codebase-knowledge.sqlite3
      APP_LOCALE: ${APP_LOCALE:-zh}
      NACOS_SERVER: ${NACOS_SERVER:-}
      NACOS_DATA_ID: ${NACOS_DATA_ID:-codebase-knowledge.properties}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}

    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - app-data:/data

volumes:
  app-data:
